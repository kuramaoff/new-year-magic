<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy New Year! 🎄</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(#001122, #003344);
            min-height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
            padding: 20px;
            width: 100vw;
            position: fixed;
        }
        
        .container {
            text-align: center;
            z-index: 10;
            position: relative;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }
        
        h1 {
            color: #FFD700;
            font-size: clamp(2rem, 8vw, 3.5rem);
            text-shadow: 0 0 20px #FF0000;
            margin-bottom: 20px;
            animation: glow 2s infinite alternate;
            line-height: 1.2;
            word-wrap: break-word;
            padding: 0 10px;
        }
        
        .message {
            color: white;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            margin: 20px auto;
            background: rgba(0,50,100,0.5);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid gold;
            max-width: 500px;
            width: 90%;
            line-height: 1.4;
            word-wrap: break-word;
        }
        
        .tree {
            font-size: clamp(60px, 20vw, 100px);
            margin: 15px;
            animation: bounce 1s infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 10px #FF0000; }
            to { text-shadow: 0 0 30px #FFD700, 0 0 40px #FF0000; }
        }
        
        @keyframes bounce {
            from { transform: translateY(0px); }
            to { transform: translateY(-20px); }
        }
        
        .snowflake {
            position: absolute;
            color: white;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            opacity: 0.8;
        }
        
        /* Improved Fireworks */
        .firework-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0;
            pointer-events: none;
        }
        
        .popper {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #FF0000 0%, #FF4500 100%);
            border-radius: 50%;
            pointer-events: none;
            display: none;
        }
        
        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .message {
                padding: 15px;
                width: 95%;
                margin: 15px auto;
            }
            
            h1 {
                margin-bottom: 15px;
                padding: 0 5px;
            }
            
            .tree {
                margin: 10px;
            }
        }
        
        @media (max-width: 320px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .message {
                font-size: 1.1rem;
                padding: 12px;
            }
            
            .tree {
                font-size: 50px;
            }
        }
        
        /* Prevent overflow on landscape */
        @media (orientation: landscape) and (max-height: 600px) {
            .container {
                transform: scale(0.85);
            }
            
            .tree {
                font-size: clamp(40px, 10vh, 80px);
                margin: 5px;
            }
            
            h1 {
                margin-bottom: 10px;
            }
            
            .message {
                margin: 10px auto;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tree">🎄</div>
        <h1>Happy New Year 2026!</h1>
        <div class="message">
            May all your wishes come true in the new year!<br>
            🎅✨🎁
        </div>
        <div class="tree">🎁</div>
    </div>

    <script>
        // Snowflake creation
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.innerHTML = '❄';
            snowflake.className = 'snowflake';
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.fontSize = Math.random() * 15 + 10 + 'px';
            snowflake.style.opacity = Math.random() * 0.5 + 0.3;
            document.body.appendChild(snowflake);
            
            // Animation
            const duration = Math.random() * 5 + 5;
            const endLeft = parseFloat(snowflake.style.left) + (Math.random() * 50 - 25);
            
            snowflake.animate([
                { transform: 'translateY(-100px)', left: snowflake.style.left },
                { transform: 'translateY(100vh)', left: endLeft + 'vw' }
            ], {
                duration: duration * 1000,
                easing: 'linear'
            });
            
            setTimeout(() => snowflake.remove(), duration * 1000);
        }
        
        // Realistic firework explosion
        function createFirework() {
            const x = Math.random() * 80 + 10; // Keep fireworks in view
            const y = Math.random() * 50 + 10;
            const color = `hsl(${Math.random() * 360}, 100%, 60%)`;
            const particleCount = 80 + Math.random() * 80; // Reduced for mobile
            
            // Create launch trail
            const trail = document.createElement('div');
            trail.className = 'firework-particle';
            trail.style.left = x + 'vw';
            trail.style.top = '100vh';
            trail.style.background = color;
            trail.style.boxShadow = `0 0 10px ${color}`;
            document.body.appendChild(trail);
            
            // Launch animation
            trail.animate([
                { transform: 'scale(1)', top: '100vh' },
                { transform: 'scale(0.5)', top: y + 'vh' }
            ], {
                duration: 800,
                easing: 'ease-out'
            }).onfinish = () => {
                trail.remove();
                createExplosion(x, y, color, particleCount);
            };
            
            setTimeout(() => trail.remove(), 800);
        }
        
        // Create explosion effect
        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework-particle';
                particle.style.left = x + 'vw';
                particle.style.top = y + 'vh';
                particle.style.background = color;
                particle.style.boxShadow = `0 0 8px ${color}`;
                document.body.appendChild(particle);
                
                // Random direction
                const angle = Math.random() * Math.PI * 2;
                const distance = 4 + Math.random() * 8; // Reduced for mobile
                
                const animation = particle.animate([
                    { 
                        transform: 'translate(0, 0) scale(1)', 
                        opacity: 1 
                    },
                    { 
                        transform: `translate(${Math.cos(angle) * distance}vw, ${Math.sin(angle) * distance}vh) scale(0)`, 
                        opacity: 0 
                    }
                ], {
                    duration: 600 + Math.random() * 300, // Shorter for mobile
                    easing: 'ease-out'
                });
                
                animation.onfinish = () => particle.remove();
            }
            
            // Flash effect
            const flash = document.createElement('div');
            flash.style.position = 'absolute';
            flash.style.left = (x - 5) + 'vw';
            flash.style.top = (y - 5) + 'vh';
            flash.style.width = '8vw'; // Smaller for mobile
            flash.style.height = '8vh';
            flash.style.background = `radial-gradient(circle, ${color} 0%, transparent 70%)`;
            flash.style.opacity = '0.4'; // Less intense
            flash.style.pointerEvents = 'none';
            document.body.appendChild(flash);
            
            flash.animate([
                { opacity: 0.4, transform: 'scale(0.5)' },
                { opacity: 0, transform: 'scale(1.5)' } // Smaller explosion
            ], {
                duration: 250,
                easing: 'ease-out'
            }).onfinish = () => flash.remove();
        }
        
        // Party popper effect on click/tap
        function createPartyPopper(x, y) {
            // Create popper base
            const popper = document.createElement('div');
            popper.className = 'popper';
            popper.style.left = x + 'px';
            popper.style.top = y + 'px';
            popper.style.display = 'block';
            document.body.appendChild(popper);
            
            // Explode into confetti
            const confettiCount = 40; // Reduced for mobile
            
            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = x + 'px';
                confetti.style.top = y + 'px';
                confetti.style.background = `hsl(${Math.random() * 360}, 100%, 60%)`;
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(confetti);
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 30 + Math.random() * 70; // Reduced for mobile
                
                confetti.animate([
                    { 
                        transform: 'translate(0, 0) rotate(0deg) scale(1)', 
                        opacity: 1 
                    },
                    { 
                        transform: `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance - 30}px) rotate(${Math.random() * 720}deg) scale(0)`, 
                        opacity: 0 
                    }
                ], {
                    duration: 600 + Math.random() * 300, // Shorter for mobile
                    easing: 'cubic-bezier(0.1, 0.8, 0.9, 0.1)'
                }).onfinish = () => confetti.remove();
            }
            
            // Remove popper
            setTimeout(() => popper.remove(), 100);
            
            // Play pop sound
            playPopSound();
        }
        
        // Play pop sound
        function playPopSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.2);
        }
        
        // Start animations
        setInterval(createSnowflake, 250); // Slower for mobile
        setInterval(createFirework, 2000); // Less frequent for mobile
        
        // Click/tap handler for party popper
        document.addEventListener('click', function(e) {
            createPartyPopper(e.clientX, e.clientY);
            
            // Also play New Year music on first click
            if (!window.musicPlayed) {
                window.musicPlayed = true;
                const audio = new Audio('https://assets.mixkit.co/music/preview/mixkit-happy-new-year-987.mp3');
                audio.volume = 0.2; // Quieter for mobile
                audio.play().catch(e => console.log("Autoplay blocked"));
            }
        });
        
        // Touch support for mobile
        document.addEventListener('touchstart', function(e) {
            const touch = e.touches[0];
            createPartyPopper(touch.clientX, touch.clientY);
        });
        
        // Prevent context menu on long press
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
        
        // Handle orientation change
        window.addEventListener('resize', function() {
            // Force redraw to prevent rendering issues
            document.body.style.display = 'none';
            document.body.offsetHeight; // Trigger reflow
            document.body.style.display = 'flex';
        });
        
        // Prevent zoom on double-tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
